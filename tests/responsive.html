  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Responsive QA | Tech Study Adda</title>
  <style>*{box-sizing:border-box}body{margin:0;padding:30px;color:#e9f1ff;background:#07142e;font-family:system-ui,sans-serif}h1{margin:0 0 8px}p{margin:0 0 24px;color:#9fb2d1}.frames{display:grid;gap:30px}.frame-card{width:max-content;max-width:100%;padding:14px;border:1px solid #2d4770;border-radius:16px;background:#0c2145;box-shadow:0 20px 45px #0004}.frame-card h2{margin:0 0 10px;font-size:14px}.scroller{max-width:100%;overflow:auto;border-radius:10px;background:#fff}.mobile{width:375px;height:812px}.tablet{width:768px;height:900px}.desktop{width:1366px;height:850px}iframe{display:block;border:0;background:#fff}@media(min-width:900px){.frames{grid-template-columns:auto 1fr;align-items:start}.desktop-card{grid-column:1/-1}}</style>

<body><h1>Tech Study Adda — Responsive QA</h1><p>Same production homepage rendered in independent mobile, tablet and desktop viewports.</p><main class="frames"><section class="frame-card"><h2>Mobile — 375 × 812</h2><div class="scroller"><iframe class="mobile" name="mobile" src="../index.html" title="Mobile homepage preview"></iframe></div></section><section class="frame-card"><h2>Tablet — 768 × 900</h2><div class="scroller"><iframe class="tablet" name="tablet" src="../index.html" title="Tablet homepage preview"></iframe></div></section><section class="frame-card desktop-card"><h2>Desktop — 1366 × 850</h2><div class="scroller"><iframe class="desktop" name="desktop" src="../index.html" title="Desktop homepage preview"></iframe></div></section></main></body>
